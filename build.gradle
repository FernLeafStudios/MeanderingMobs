plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    // 1. Target your local Maven repository (~/.m2/repository) where FernFrame was published
    mavenLocal()

    // 2. CurseMaven repository for pulling mods directly from CurseForge
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // Add additional remote repositories here if needed
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 1. Mixin Processor & Extras
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation "io.github.llamalad7:mixinextras-neoforge:0.4.1"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.4.1"

    // 2. FernFrame Core Library
    jarJar(implementation("com.fernleaf.fernframe:fernframe:1.0.0")) {
        version {
            prefer('1.0.0')
        }
    }

    compileOnly fileTree(dir: 'compile', include: ['*.jar'])
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.joml:joml:1.10.5"

    // Compats
    compileOnly "curse.maven:redomesticate-1541881:8524088"
    localRuntime "curse.maven:redomesticate-1541881:8524088"

    compileOnly "curse.maven:field-guide-1470590:8682496"
    localRuntime "curse.maven:field-guide-1470590:8682496"

    compileOnly "curse.maven:item-descriptions-1101501:8228839"
    localRuntime "curse.maven:item-descriptions-1101501:8228839"

    compileOnly "curse.maven:immersive-overlays-1245453:8701560"
    localRuntime "curse.maven:immersive-overlays-1245453:8701560"

    compileOnly "curse.maven:no-mans-land-538493:8359457"
    localRuntime "curse.maven:no-mans-land-538493:8359457"

    compileOnly "curse.maven:mod-primal-1351626:7909458"
    localRuntime "curse.maven:mod-primal-1351626:7909458"

    compileOnly "curse.maven:spawn-mod-935694:8507225"
    localRuntime "curse.maven:spawn-mod-935694:8507225"

    compileOnly "curse.maven:teallib-1597849:8507094"
    localRuntime "curse.maven:teallib-1597849:8507094"

    compileOnly "curse.maven:geckolib-388172:8350073"
    localRuntime "curse.maven:geckolib-388172:8350073"

    // 4. Runtime performance testing
    localRuntime "maven.modrinth:sodium:mc1.21.1-0.8.13-beta.2-neoforge"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}